<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RialORBIT</title>
  <link rel="shortcut icon" href="rialORBIT.png" type="image/x-icon">
  <style>
    body { margin:0; overflow:hidden; background:#000; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.136.0";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls";

// Scene setup
let scene = new THREE.Scene();
scene.background = new THREE.Color('#160016');
let camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 1, 1000);
camera.position.set(0, 0, 60);

let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

let gu = { time: { value: 0 } };

// -----------------------
// Function: tạo particle từ ảnh
// -----------------------
function createParticleLogo_logo(imageSrc, scale=0.2, color1=[42,40,154], color2=[209,124,196]) {
  return new Promise(resolve => {
    const img = new Image();
    img.src = imageSrc;
    img.onload = () => {
      const size = 256;
      const cvs = document.createElement("canvas");
      cvs.width = cvs.height = size;
      const ctx = cvs.getContext("2d");
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      let pts=[], sizes=[], shift=[];
      function pushShift() {
        shift.push(
          Math.random() * Math.PI,
          Math.random() * Math.PI * 2,
          (Math.random() * 1 + 0.1) * Math.PI * 0.1,
          Math.random() * 1 + 0.1
        );
      }

      for(let y=0;y<size;y+=2){
        for(let x=0;x<size;x+=2){
          const i=(y*size+x)*4;
          const r=data[i], g=data[i+1], b=data[i+2];
          if((r+g+b)/3 < 128){ // chọn pixel tối
            let wx=(x-size/2)*scale;
            let wy=(size/2-y)*scale;
            let wz=(Math.random()-0.5)*6;
            pts.push(new THREE.Vector3(wx,wy,wz));
            sizes.push(Math.random()*1.5+0.5);
            pushShift();
          }
        }
      }

      let g = new THREE.BufferGeometry().setFromPoints(pts);
      g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes,1));
      g.setAttribute("shift", new THREE.Float32BufferAttribute(shift,4));

      let m = new THREE.PointsMaterial({
        size: 0.5,
        transparent: true,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        onBeforeCompile: shader => {
          shader.uniforms.time = gu.time;
          shader.vertexShader = `
            uniform float time;
            attribute float sizes;
            attribute vec4 shift;
            varying vec3 vColor;
            const float PI2 = 6.28318530718;
            ${shader.vertexShader}
          `.replace(
            `gl_PointSize = size;`,
            `gl_PointSize = size * sizes;`
          ).replace(
            `#include <color_vertex>`,
            `#include <color_vertex>
             vColor = mix(vec3(${color1.join(",")}), vec3(${color2.join(",")}), position.z/10.0+0.5) / 255.;
          `).replace(
            `#include <begin_vertex>`,
            `#include <begin_vertex>
             float t = time;
             float moveT = mod(shift.x + shift.z * t, PI2);
             float moveS = mod(shift.y + shift.z * t, PI2);
             transformed += vec3(cos(moveS)*sin(moveT), cos(moveT), sin(moveS)*sin(moveT)) * shift.a;
          `);

          shader.fragmentShader = `
            varying vec3 vColor;
            ${shader.fragmentShader}
          `.replace(
            `#include <clipping_planes_fragment>`,
            `#include <clipping_planes_fragment>
             float d = length(gl_PointCoord.xy-0.5);
             if(d>0.5) discard;
          `).replace(
            `vec4 diffuseColor = vec4( diffuse, opacity );`,
            `vec4 diffuseColor = vec4( vColor, smoothstep(0.5,0.1,d) );`
          );
        }
      });

      let p = new THREE.Points(g,m);
      resolve(p);
    };
  });
}
// -----------------------
// Function: tạo particle từ ảnh
// -----------------------
function createParticleLogo_orbit(imageSrc, scale=0.2, color1=[42,40,154], color2=[209,124,196]) {
  return new Promise(resolve => {
    const img = new Image();
    img.src = imageSrc;
    img.onload = () => {
      const size = 256;
      const cvs = document.createElement("canvas");
      cvs.width = cvs.height = size;
      const ctx = cvs.getContext("2d");
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      let pts=[], sizes=[], shift=[];
      function pushShift() {
        shift.push(
          Math.random() * Math.PI,
          Math.random() * Math.PI * 2,
          (Math.random() * 0.6 + 0.1) * Math.PI * 0.1,
          Math.random() * 0.6 + 0.1
        );
      }

      for(let y=0;y<size;y+=2){
        for(let x=0;x<size;x+=2){
          const i=(y*size+x)*4;
          const r=data[i], g=data[i+1], b=data[i+2];
          if((r+g+b)/3 > 10){ // chọn pixel sáng
            let wx=(x-size/2)*scale;
            let wy=(size/2-y)*scale*0.61;
            // Bẻ cong: chuyển wx thành góc trên vòng tròn
            let radius = 18;
            let theta = wx / radius; // độ cong
            let newX = Math.sin(theta) * radius;
            let newZ = -Math.cos(theta) * radius;
            let wz=(Math.random()-0.5)*1.6; // giảm độ dày z
            pts.push(new THREE.Vector3(newX, wy, newZ));
            sizes.push(Math.random()*1.5+0.5);
            pushShift();
          }
        }
      }

      let g = new THREE.BufferGeometry().setFromPoints(pts);
      g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes,1));
      g.setAttribute("shift", new THREE.Float32BufferAttribute(shift,4));

      let m = new THREE.PointsMaterial({
        size: 0.3,
        transparent: true,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        onBeforeCompile: shader => {
          shader.uniforms.time = gu.time;
          shader.vertexShader = `
            uniform float time;
            attribute float sizes;
            attribute vec4 shift;
            varying vec3 vColor;
            const float PI2 = 6.28318530718;
            ${shader.vertexShader}
          `.replace(
            `gl_PointSize = size;`,
            `gl_PointSize = size * sizes;`
          ).replace(
            `#include <color_vertex>`,
            `#include <color_vertex>
             float tcol = clamp(abs(position.z) / 10.0 + 0.5, 0.0, 1.0);
             vColor = mix(vec3(${color1.join(",")}), vec3(${color2.join(",")}), tcol) / 255.;
          `).replace(
            `#include <begin_vertex>`,
            `#include <begin_vertex>
             float t = time;
             float moveT = mod(shift.x + shift.z * t, PI2);
             float moveS = mod(shift.y + shift.z * t, PI2);
             transformed += vec3(cos(moveS)*sin(moveT), cos(moveT), sin(moveS)*sin(moveT)) * shift.a;
          `);

          shader.fragmentShader = `
            varying vec3 vColor;
            ${shader.fragmentShader}
          `.replace(
            `#include <clipping_planes_fragment>`,
            `#include <clipping_planes_fragment>
             float d = length(gl_PointCoord.xy-0.5);
             if(d>0.5) discard;
          `).replace(
            `vec4 diffuseColor = vec4( diffuse, opacity );`,
            `vec4 diffuseColor = vec4( vColor, smoothstep(0.5,0.1,d) );`
          );
        }
      });

      let p = new THREE.Points(g,m);
      resolve(p);
    };
  });
}

// -----------------------
// Main
// -----------------------
Promise.all([
  createParticleLogo_logo("rialo_logo.png", 0.2), // logo chính
  createParticleLogo_orbit("rethink.png", 0.1),  // logo vòng ngoài nhỏ hơn
  createParticleLogo_orbit("rebuild.png", 0.1),  // logo vòng ngoài nhỏ hơn
  createParticleLogo_orbit("rialo.png", 0.1)  // logo vòng ngoài nhỏ hơn
]).then(([rialo1, rialo2, rialo3, rialo4]) => {
  // Logo chính
  scene.add(rialo1);

  // Tạo group chứa 3 logo orbit
  const ringGroup = new THREE.Group();
  const logos = [rialo2, rialo3, rialo4];
  const segments = logos.length;  // 3
  const radiusGen = 6;

  for (let i = 0; i < segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    const x = Math.cos(angle) * radiusGen;
    const z = Math.sin(angle) * radiusGen;

    // clone mỗi logo riêng
    const copy = logos[i].clone();
    copy.position.set(x, 0, z);
    copy.scale.x *= -1; // lật theo trục đứng
    copy.lookAt(0, 0, 0);
    ringGroup.add(copy);
  }

  scene.add(ringGroup);

  // Animation
  let clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    controls.update();
    let t = clock.getElapsedTime();
    gu.time.value = t * Math.PI; 

    rialo1.rotation.z = 0; // logo chính đứng yên

    // quay quanh trục y giống Trái đất quay
    ringGroup.rotation.y = t * 0.2;

    renderer.render(scene, camera);
  });
});
</script>
</body>
</html>
